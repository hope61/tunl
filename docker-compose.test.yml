services:
  vps:
    build:
      context: .
      dockerfile: Dockerfile.test
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      public:
        ipv4_address: 172.30.0.10
      wan:
        ipv4_address: 172.31.0.10
    volumes:
      - shared:/shared
    entrypoint: ["/bin/bash", "/src/test/setup-vps.sh"]

  home:
    build:
      context: .
      dockerfile: Dockerfile.test
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      wan:
        ipv4_address: 172.31.0.20
    volumes:
      - shared:/shared
    entrypoint: ["/bin/bash", "/src/test/setup-home.sh"]

  client:
    build:
      context: .
      dockerfile: Dockerfile.test
    cap_add:
      - NET_ADMIN
    networks:
      public:
        ipv4_address: 172.30.0.30
    volumes:
      - shared:/shared
    entrypoint: ["/bin/bash", "/src/test/integration.sh"]
    depends_on:
      - vps
      - home

volumes:
  shared:

networks:
  public:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  wan:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
